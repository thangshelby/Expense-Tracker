<!-- NAVBAR -->
<p-confirmdialog />
<div
  class="border-b-1 bg-background-page border-border flex flex-row items-center justify-between px-8 py-4 transition-colors duration-500 ease-in-out"
>
  <!-- NAVBAR LEFT CONTENT -->
  <div class="flex flex-row items-center gap-4">
    <button
      (click)="onToggleSidenav()"
      class="border-border flex cursor-pointer items-center rounded-lg border p-2"
    >
      <mat-icon style="color: #8b93a3" class="text-gray-300">menu </mat-icon>
    </button>
    <div
      class="text-sub-headline border-border flex flex-1 flex-row gap-2 rounded-lg border p-2 px-4 text-sm focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-200"
    >
      <mat-icon style="color: #8b93a3" class="text-gray-300">search </mat-icon>

      <input
        type="text"
        class="w-80 bg-transparent outline-none"
        placeholder="Search or type commands..."
      />

      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="size-6"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M6 18 18 6M6 6l12 12"
        />
      </svg>
    </div>
  </div>

  <!-- NAVBAR RIGHT CONTENT -->
  <div class="flex gap-4">
    <button
      (click)="onToggleTheme()"
      class="border-border flex cursor-pointer items-center rounded-full border p-2 hover:bg-gray-100"
    >
      @if(isDark$|async){

      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="#8b93a3"
        class="size-6 scale-75"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"
        />
      </svg>
      } @if (! (isDark$|async) ) {

      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="#8b93a3"
        class="size-6 scale-75"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"
        />
      </svg>
      }
    </button>
    <button
      (click)="onToggleSidenav()"
      class="border-border flex cursor-pointer items-center rounded-full border p-2 hover:bg-gray-100"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="2"
        stroke="#8b93a3"
        class="size-6 scale-75"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0"
        />
      </svg>
    </button>

    <div class="flex flex-row items-center gap-2">
      <img class="h-10 w-auto rounded-full" [src]="user?.photoURL||''" />
      <span class="text-sub-headline">{{user?.displayName}}</span>
      <div class="flex items-center justify-center">
        <button class="cursor-pointer" (click)="togglePopover($event)">
          <svg
            [ngClass]="{ 'rotate-180': isPopoverOpen }"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="#8b93a3"
            class="size-6 scale-90 transition-transform duration-300"
          >
            <path
              fill-rule="evenodd"
              d="M12.53 16.28a.75.75 0 0 1-1.06 0l-7.5-7.5a.75.75 0 0 1 1.06-1.06L12 14.69l6.97-6.97a.75.75 0 1 1 1.06 1.06l-7.5 7.5Z"
              clip-rule="evenodd"
            />
          </svg>
        </button>

        <p-popover #op styleClass="!mt-6 !bg-white !border-border !p-0">
          <div class="flex flex-col gap-8">
            <div class="flex flex-col">
              <p class="text-headline">{{user?.displayName}}</p>
              <p class="text-sub-headline text-sm font-[500]">
                {{user?.email}}
              </p>
            </div>
            <ul class="flex list-none flex-col">
              @for (item of items; track item; let i = $index) {
              <li
                class="flex cursor-pointer items-center gap-2 rounded-lg px-6 py-2 hover:bg-gray-200"
              >
                <mat-icon style="color: #8b93a3; scale: 85%"
                  >{{item.icon}}</mat-icon
                >
                <span class="text-headline text-sm font-medium"
                  >{{item.title}}</span
                >
              </li>
              @if(i==items.length-1){
              <p-divider styleClass="text-[#8b93a3]!" />
              <li
                (click)="confirm1($event)"
                class="flex cursor-pointer items-center gap-2 rounded-lg px-6 py-2 hover:bg-gray-200"
              >
                <mat-icon style="color: #8b93a3; scale: 85%">logout</mat-icon>
                <span class="text-headline text-sm font-medium">Logout</span>
              </li>
              } }
            </ul>
          </div>
        </p-popover>
      </div>
    </div>
  </div>
</div>
