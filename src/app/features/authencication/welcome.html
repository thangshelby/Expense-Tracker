<div class="flex h-screen flex-row">
  <div class="flex w-[45%] flex-col items-center justify-between bg-white py-8">
    <div
      class="flex min-h-full w-full flex-col justify-center gap-8 px-12 py-12 lg:px-28"
    >
      <div class="sm:w-full sm:max-w-sm">
        <img
          class="mx-auto h-10 w-auto"
          src="https://tailwindcss.com/plus-assets/img/logos/mark.svg?color=indigo&shade=600"
          alt="Your Company"
        />
        <h2
          class="text-center text-2xl/9 font-bold tracking-tight text-gray-900"
        >
          Sign in to your account
        </h2>
      </div>

      <router-outlet></router-outlet>

      <!-- CONTINUE WITH GITHUB OR GOOGLE  -->
      <div class="flex flex-col gap-2">
        <div class="flex flex-row items-center justify-between gap-3">
          <div class="border-t-1 flex-1 border-gray-400"></div>
          <span class="text-sub-headline">Or continue with</span>
          <div class="border-t-1 flex-1 border-gray-400"></div>
        </div>
        <div class="flex w-full flex-row justify-between gap-4">
          <button
            (click)="onGoogleLogin()"
            class="flex flex-1 cursor-pointer flex-row items-center justify-start gap-4 rounded-lg border border-gray-300 p-2 px-6 hover:bg-gray-200"
          >
            <img class="h-6 w-6" src="/assets/images/google.png" />
            <span class="text-headline font-medium">Google</span>
          </button>
          <button
            (click)="onGithublogin()"
            class="flex flex-1 cursor-pointer flex-row items-center justify-start gap-4 rounded-lg border border-gray-300 p-2 px-6 hover:bg-gray-200"
          >
            <img class="h-6 w-6" src="/assets/images/github.png" />
            <span class="text-headline font-medium">Github</span>
          </button>
        </div>
      </div>

      <p class="text-center text-sm/6 text-gray-500">
        Not a member?
        <a href="#" class="font-semibold text-indigo-600 hover:text-indigo-500"
          >Start a 14 day free trial</a
        >
      </p>
    </div>
  </div>
  <div class="h-full w-full flex-1">
    <img
      class="h-full w-full"
      src="https://images.unsplash.com/photo-1496917756835-20cb06e75b4e?ixlib=rb-1.2.1&ixid=eyJhcHBfaWQiOjEyMDd9&auto=format&fit=crop&w=1908&q=80"
    />
  </div>
</div>
