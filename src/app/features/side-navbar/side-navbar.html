<div
  class="bg-background-page flex h-screen flex-col items-center justify-between p-4 py-12 transition-colors duration-500 ease-in-out"
>
  <div class="flex flex-col gap-8">
    <div class="flex w-full flex-row items-center gap-2 px-4">
      <img class="h-8 w-8" src="../../../assets/favicon.ico" />
      <h2 class="text-md font-extrabold">Expense Tracker</h2>
    </div>

    <div class="flex flex-col gap-1">
      @for (item of sideNavItems(); track item.key) {
      <button
        [ngClass]="(item.key==activatedSideNavItem?'bg-gray-200 text-primary font-medium':'')+' flex w-full hover:cursor-pointer flex-row items-center hover:bg-gray-200 gap-1 group rounded-md p-3'"
        (click)="item.click()"
      >
        <mat-icon
          [ngStyle]="{ color:item.key ===activatedSideNavItem ? '#5e74fd' : '#1d2939' }"
        >
          {{ item.icon }}
        </mat-icon>
        <span class="">{{item.title}}</span>
      </button>
      }
    </div>
  </div>
  <div class="flex flex-col gap-2">
    <button
      class="group flex w-full flex-row items-center gap-1 rounded-md p-3 hover:cursor-pointer hover:bg-gray-200"
    >
      <mat-icon>settings</mat-icon>Settings
    </button>
    <button
      mat-raised-
      color="primary"
      class="group flex w-full flex-row items-center gap-1 rounded-md p-3 hover:cursor-pointer hover:bg-gray-200"
    >
      <mat-icon>logout</mat-icon>Logout
    </button>
  </div>
</div>
