    <div class="bg-white rounded-2xl w-full flex-1 flex flex-col justify-between shadow-lg h-full border-1 overflow-hidden border-gray-200">
          <!-- Header -->
           <div class="p-6 rounded-2xl">

          <div class="flex justify-between items-start mb-6">
            <div>
              <h2 class="text-xl font-semibold text-gray-900">Monthly Target</h2>
              <p class="text-sm text-gray-500 mt-1">Target you've set for each month</p>
            </div>
            <button class="text-gray-400 hover:text-gray-600">
              <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                <path
                  d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z" />
              </svg>
            </button>
          </div>

          <!-- Progress Circle -->
          <div class="flex justify-center mb-6">
          <!-- gauge-chart.component.html -->
<div class="text-center">
  <apx-chart
    [series]="chartSeries"
    [chart]="chartOptions.chart"
    [labels]="chartOptions.labels"
    [plotOptions]="chartOptions.plotOptions"
    [fill]="chartOptions.fill"
    [stroke]="chartOptions.stroke"
    [dataLabels]="chartOptions.dataLabels"
  ></apx-chart>

  <div class="text-xl font-bold -mt-10">{{ chartSeries[0] }}%</div>
  <div
    class="inline-block mt-2 px-2 py-1 text-xs rounded-full bg-green-100 text-green-600 font-semibold"
  >
    +10%
  </div>
</div>

          </div>

          <!-- Message -->
          <div class="text-center mb-8">
            <p class="text-gray-600 text-sm leading-relaxed">
              You earn <span class="font-semibold">${{ todayEarnings }}</span> today, it's higher than last month.<br>
              Keep up your good work!
            </p>
          </div>
           </div>

          <!-- Stats -->
          <div class="flex justify-between items-center bg-gray-300 p-4 ">
            <!-- Target -->
            <div class="flex flex-col items-center">
              <p class="text-xs text-gray-500 mb-2">Target</p>
              <div class="flex items-center justify-center">
                <span class="text-lg font-bold text-gray-900">${{ target }}</span>
                <svg class="w-4 h-4 ml-1 text-red-500" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M7 14l5-5 5 5z" />
                </svg>
              </div>
            </div>

            <!-- Revenue -->
            <div class="flex flex-col items-center">
              <p class="text-xs text-gray-500 mb-2">Revenue</p>
              <div class="flex items-center justify-center">
                <span class="text-lg font-bold text-gray-900">${{ revenue }}</span>
                <svg class="w-4 h-4 ml-1 text-green-500" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M7 10l5 5 5-5z" />
                </svg>
              </div>
            </div>

            <!-- Today -->
            <div class="flex flex-col items-center">
              <p class="text-xs text-gray-500 mb-2">Today</p>
              <div class="flex items-center justify-center">
                <span class="text-lg font-bold text-gray-900">${{ today }}</span>
                <svg class="w-4 h-4 ml-1 text-green-500" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M7 10l5 5 5-5z" />
                </svg>
              </div>
            </div>
          </div>
        </div>
