<div
  class="bg-background-page flex flex-col overflow-auto transition-colors duration-300 ease-in-out"
>
  <!-- CONTENT  -->
  <div class="flex h-full w-full flex-col gap-y-12 p-6">
    <!-- DASHBOARD OVERVIEW -->
    <div class="flex h-full flex-1 flex-row gap-6">
      <!-- OVERVIEW  -->
      <div class="w-[66%]">
        <app-dashboard-overview />
      </div>
      <!-- ANALYTICS -->
      <div class="w-[34%]">
        <app-monthly-target />
      </div>
    </div>
    <!-- DASHBOARD STATISTIC -->
    <div class="">
      <app-statistics />
    </div>

    <!-- THIRD ITEM -->
    <div class="flex flex-col gap-y-4 rounded-lg bg-white p-4">
      <h1 class="text-xl font-medium">Detail Summary</h1>
      <span class="text-gray-500">Click on row to Edit/Delete Expense</span>
      <div class="mat-elevation-z8">
        <table mat-table [dataSource]="dataSource">
          <!-- Position Column -->
          <ng-container matColumnDef="position">
            <th mat-header-cell *matHeaderCellDef>No.</th>
            <td mat-cell *matCellDef="let element">{{element.position}}</td>
          </ng-container>

          <!-- Name Column -->
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Name</th>
            <td mat-cell *matCellDef="let element">{{element.name}}</td>
          </ng-container>

          <!-- Weight Column -->
          <ng-container matColumnDef="weight">
            <th mat-header-cell *matHeaderCellDef>Weight</th>
            <td mat-cell *matCellDef="let element">{{element.weight}}</td>
          </ng-container>

          <!-- Symbol Column -->
          <ng-container matColumnDef="symbol">
            <th mat-header-cell *matHeaderCellDef>Symbol</th>
            <td mat-cell *matCellDef="let element">{{element.symbol}}</td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        <mat-paginator
          [pageSizeOptions]="[5, 10, 20]"
          showFirstLastButtons
          aria-label="Select page of periodic elements"
        >
        </mat-paginator>
      </div>
    </div>
  </div>
</div>
