<!-- Notification Settings -->
<div class="grid grid-cols-1 gap-6 py-6 lg:grid-cols-2">
  <!-- Email Settings -->
  <p-card class="border border-slate-700 bg-slate-800/50">
    <ng-template pTemplate="header">
      <div class="p-4">
        <h3 class="text-xl font-bold text-white">📧 Thông báo Email</h3>
      </div>
    </ng-template>

    <form [formGroup]="emailSettingsForm" (ngSubmit)="saveEmailSettings()">
      <div class="space-y-4 p-2">
        <div class="flex items-center justify-between">
          <div>
            <label class="font-medium text-white">Kích hoạt email</label>
            <p class="text-sm text-slate-400">Nhận cảnh báo qua email</p>
          </div>
          <p-toggleswitch [(ngModel)]="checked" />

          <p-toggleswitch formControlName="emailEnabled"></p-toggleswitch>
        </div>

        <div>
          <label class="mb-2 block text-sm font-medium text-white"
            >Email nhận thông báo</label
          >
          <input
            pInputText
            formControlName="notificationEmail"
            placeholder="example@email.com"
            class="w-full border-slate-600 bg-slate-700/50 p-2 text-white outline-none"
          />
        </div>

        <div class="space-y-3">
          <h4 class="font-medium text-white">Loại cảnh báo</h4>

          <div class="flex items-center justify-between">
            <span class="text-slate-300">Vượt ngân sách</span>
            <p-toggleSwitch formControlName="budgetAlerts"></p-toggleSwitch>
          </div>

          <div class="flex items-center justify-between">
            <span class="text-slate-300">Nhắc trả nợ</span>
            <p-toggleSwitch formControlName="debtReminders"></p-toggleSwitch>
          </div>

          <div class="flex items-center justify-between">
            <span class="text-slate-300">Giao dịch định kỳ</span>
            <p-toggleSwitch
              formControlName="recurringTransactions"
            ></p-toggleSwitch>
          </div>

          <div class="flex items-center justify-between">
            <span class="text-slate-300">Không hoạt động</span>
            <p-toggleSwitch formControlName="inactivityAlerts"></p-toggleSwitch>
          </div>
        </div>

        <div>
          <label class="mb-2 block text-sm font-medium text-white"
            >Tần suất gửi</label
          >
          <p-select
            [options]="emailFrequencyOptions"
            formControlName="emailFrequency"
            placeholder="Chọn tần suất"
            class="w-full"
          >
          </p-select>
        </div>
      </div>

      <p-button
        label="Lưu cài đặt"
        icon="pi pi-save"
        type="submit"
        class="mt-6 w-full"
      >
      </p-button>
    </form>
  </p-card>

  <!-- Push Notification Settings -->
  <p-card class="border border-slate-700 bg-slate-800/50">
    <ng-template pTemplate="header">
      <div class="p-4">
        <h3 class="text-xl font-bold text-white">📱 Thông báo đẩy</h3>
      </div>
    </ng-template>

    <form [formGroup]="pushSettingsForm" (ngSubmit)="savePushSettings()">
      <div class="space-y-4">
        <div class="flex items-center justify-between">
          <div>
            <label class="font-medium text-white"
              >Kích hoạt thông báo đẩy</label
            >
            <p class="text-sm text-slate-400">Nhận thông báo trên thiết bị</p>
          </div>
          <p-toggleSwitch formControlName="pushEnabled"></p-toggleSwitch>
        </div>

        <div class="space-y-3">
          <h4 class="font-medium text-white">Thời gian thông báo</h4>

          <div>
            <label class="mb-2 block text-sm font-medium text-white"
              >Giờ bắt đầu</label
            >
            <p-datePicker
              formControlName="startTime"
              [timeOnly]="true"
              hourFormat="24"
              class="w-full"
            >
            </p-datePicker>
          </div>

          <div>
            <label class="mb-2 block text-sm font-medium text-white"
              >Giờ kết thúc</label
            >
            <p-datePicker
              formControlName="endTime"
              [timeOnly]="true"
              hourFormat="24"
              class="w-full"
            >
            </p-datePicker>
          </div>
        </div>

        <div>
          <label class="mb-2 block text-sm font-medium text-white"
            >Mức độ ưu tiên</label
          >
          <p-selectButton
            [options]="priorityOptions"
            formControlName="priority"
            class="w-full"
          >
          </p-selectButton>
        </div>

        <div>
          <label class="mb-2 block text-sm font-medium text-white"
            >Âm thanh thông báo</label
          >
          <p-select
            [options]="soundOptions"
            formControlName="sound"
            placeholder="Chọn âm thanh"
            class="w-full"
          >
          </p-select>
        </div>
      </div>

      <p-button
        label="Lưu cài đặt"
        icon="pi pi-save"
        type="submit"
        class="mt-6 w-full"
      >
      </p-button>
    </form>
  </p-card>
</div>

<!-- Test Notifications -->
<div class="mt-6">
  <p-card class="border border-slate-700 bg-slate-800/50">
    <ng-template pTemplate="header">
      <div class="p-4">
        <h3 class="text-xl font-bold text-white">🧪 Kiểm tra thông báo</h3>
      </div>
    </ng-template>

    <div class="flex flex-wrap gap-4">
      <p-button
        label="Kiểm tra Email"
        icon="pi pi-envelope"
        class="p-button-outlined"
        (onClick)="testEmail()"
      >
      </p-button>

      <p-button
        label="Kiểm tra Push"
        icon="pi pi-mobile"
        class="p-button-outlined"
        (onClick)="testPushNotification()"
      >
      </p-button>

      <p-button
        label="Kiểm tra tất cả"
        icon="pi pi-send"
        class="p-button-outlined p-button-success"
        (onClick)="testAllNotifications()"
      >
      </p-button>
    </div>
  </p-card>
</div>
